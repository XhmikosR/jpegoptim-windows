name: "CodeQL"

on:
  push:
    branches:
      - "**"
      - "!dependabot/**"
  pull_request:
    branches:
      - "**"
      - "!dependabot/**"
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      checks: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Set up NASM
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        with:
          version: 3.02

      - name: Build mozjpeg outside CodeQL tracing
        run: CALL "build.bat" mozjpeg
        shell: cmd

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: "cpp,actions"
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build jpegoptim
        run: CALL "build.bat" jpegoptim
        shell: cmd

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
